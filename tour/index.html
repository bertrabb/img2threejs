<style>
/* Layout: full-bleed 3D canvas; brass-on-smoked-glass overlays pinned to the edges (caption bottom-left, controls top-right, stop rail along the bottom). Single deliberate dark look so the overlays read over sky and marble alike. */
:root {
  --ink: #f4efe4;          /* ivory text */
  --ink-dim: #c9c1b0;
  --glass: rgba(24, 21, 16, 0.74);
  --glass-hi: rgba(44, 38, 28, 0.86);
  --brass: #d4ae5c;
  --brass-deep: #9c7a33;
  --line: rgba(212, 174, 92, 0.35);
  --f-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: #1a1712; color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { pointer-events: auto; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; letter-spacing: 0.08em; color: var(--brass); text-wrap: balance; }
.brand p { margin: 2px 0 0; font-size: 0.72rem; color: var(--ink-dim); letter-spacing: 0.02em; }
.tools { pointer-events: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
button { font: inherit; color: var(--ink); cursor: pointer; }
.tbtn { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; font-size: 0.8rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.tbtn[aria-pressed="true"] { background: var(--brass); color: #1d170c; border-color: var(--brass); }
.tbtn:focus-visible, .chip:focus-visible, .nav:focus-visible, .hs:focus-visible, .cta:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.cta { background: var(--brass); color: #1d170c; border: 0; text-decoration: none; border-radius: 999px; padding: 8px 16px; font-size: 0.8rem; font-weight: 600; }

.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
  display: flex; flex-direction: column; gap: 10px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.caption { pointer-events: auto; max-width: 30rem; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.caption .count { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass); font-variant-numeric: tabular-nums; }
.caption h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 1.3rem; letter-spacing: 0.04em; text-wrap: balance; }
.caption p { margin: 0; font-size: 0.88rem; line-height: 1.5; color: var(--ink-dim); max-width: 62ch; }
.caption .row { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.nav { background: transparent; border: 1px solid var(--line); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; font-size: 1rem; }
.hint { font-size: 0.72rem; color: var(--ink-dim); }
.rail { pointer-events: auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.rail::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 13px; font-size: 0.78rem; white-space: nowrap; }
.chip[aria-current="true"] { background: var(--glass-hi); border-color: var(--brass); color: var(--brass); }
.note { font-size: 0.66rem; color: var(--ink-dim); opacity: 0.85; }

#hotspots { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
.hs { position: absolute; left: 0; top: 0; pointer-events: auto; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
  background: rgba(212, 174, 92, 0.22); border: 1.5px solid var(--brass); display: grid; place-items: center; padding: 0; }
.hs::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--brass); }
.hs span { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 6px); white-space: nowrap; font-size: 0.7rem;
  background: var(--glass); border-radius: 6px; padding: 3px 7px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.hs:hover span, .hs:focus-visible span { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .hs { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(212,174,92,.45); } 50% { box-shadow: 0 0 0 8px rgba(212,174,92,0); } }
}
#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: #1a1712; font-family: var(--f-display); letter-spacing: .12em; color: var(--brass); }
@media (max-width: 560px) {
  .brand p { display: none; }
  .caption { padding: 12px 14px; }
  .caption h2 { font-size: 1.1rem; }
  .caption p { font-size: 0.82rem; }
  .hint { display: none; }
}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// Booking link: set to your reservation page to show the "Reservar" button.
const BOOKING_URL = '';

/* ------------------------------------------------------------------ utils */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function canvasTex(w, h, draw, repeat = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); t.anisotropy = 8;
  return t;
}

/* --------------------------------------------------------------- textures */
function marbleTex(seed, w = 1024, h = 1024, seams = 0) {
  return canvasTex(w, h, (g, W, H) => {
    const r = rng(seed);
    g.fillStyle = '#f3f2ef'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 40; i++) { // soft cloud
      g.fillStyle = `rgba(200,200,205,${0.03 + r() * 0.04})`;
      g.beginPath(); g.ellipse(r() * W, r() * H, 60 + r() * 200, 30 + r() * 120, r() * 3, 0, 7); g.fill();
    }
    const vein = (x, y, ang, len, width, col, blur) => {
      g.save(); g.filter = `blur(${blur}px)`; g.strokeStyle = col; g.lineWidth = width; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < len; s += 8) { ang += (r() - 0.5) * 0.35; x += Math.cos(ang) * 8; y += Math.sin(ang) * 8; g.lineTo(x, y);
        if (r() < 0.02) vein(x, y, ang + (r() - 0.5) * 1.6, len * 0.3 * r(), width * 0.5, col, blur); }
      g.stroke(); g.restore();
    };
    for (let i = 0; i < 4; i++) { const x0 = r() * W, a0 = 1.25 + r() * 0.6, w0 = 10 + r() * 22; vein(x0, -20, a0, H * 1.6, w0, 'rgba(150,154,162,0.45)', 6); vein(x0, -20, a0, H * 1.6, w0 * 0.35, 'rgba(105,108,116,0.6)', 2); }
    for (let i = 0; i < 9; i++) vein(r() * W, r() * H, r() * 6.28, 300 + r() * 600, 1 + r() * 1.5, 'rgba(110,112,118,0.6)', 0.6);
    for (let i = 0; i < 4; i++) vein(r() * W, r() * H, r() * 6.28, 200 + r() * 300, 1.2, 'rgba(176,140,80,0.55)', 0.5);
    if (seams) { g.strokeStyle = 'rgba(150,150,150,0.35)'; g.lineWidth = 2; for (let i = 1; i < seams; i++) { const x = i * W / seams; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); } }
  });
}
const osbTex = canvasTex(1024, 1024, (g, W, H) => {
  const r = rng(7); g.fillStyle = '#c59f66'; g.fillRect(0, 0, W, H);
  const cols = ['#d8b47a', '#b98d52', '#e2c290', '#a97c43', '#cfa86c', '#8f6a38'];
  for (let i = 0; i < 2600; i++) { g.save(); g.translate(r() * W, r() * H); g.rotate(r() * 3.14);
    g.fillStyle = cols[(r() * cols.length) | 0]; g.globalAlpha = 0.55 + r() * 0.4; g.fillRect(-20 - r() * 30, -4 - r() * 5, 40 + r() * 60, 8 + r() * 9); g.restore(); }
}, [1, 1]);
const floorTex = canvasTex(1024, 1024, (g, W, H) => {
  const r = rng(11); g.fillStyle = '#76787a'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 900; i++) { const v = 90 + r() * 60 | 0; g.fillStyle = `rgba(${v},${v},${v + 2},${0.08 + r() * 0.12})`;
    g.beginPath(); g.arc(r() * W, r() * H, 6 + r() * 60, 0, 7); g.fill(); }
  g.strokeStyle = 'rgba(80,80,80,0.18)'; g.lineWidth = 2; g.strokeRect(0, 0, W, H);
}, [5, 5]);
const damaskTex = canvasTex(512, 512, (g, W, H) => {
  g.fillStyle = '#5b5428'; g.fillRect(0, 0, W, H);
  const cell = 64;
  for (let y = 0; y <= H; y += cell) for (let x = (y / cell % 2) * cell / 2 - cell; x <= W; x += cell) {
    g.save(); g.translate(x + cell / 2, y + cell / 2);
    g.strokeStyle = '#d8c27a'; g.lineWidth = 3;
    g.beginPath(); g.ellipse(0, 0, cell * 0.36, cell * 0.48, 0, 0, 7); g.stroke();
    g.fillStyle = '#c9ae5e';
    for (let k = 0; k < 6; k++) { g.rotate(Math.PI / 3); g.beginPath(); g.ellipse(0, 8, 4, 9, 0, 0, 7); g.fill(); }
    g.beginPath(); g.arc(0, 0, 4, 0, 7); g.fill(); g.restore();
  }
}, [3, 3]);
const pineTex = canvasTex(256, 1024, (g, W, H) => {
  const r = rng(5); g.fillStyle = '#b07a43'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 90; i++) { g.strokeStyle = `rgba(${90 + r() * 40},${55 + r() * 25},25,${0.15 + r() * 0.25})`; g.lineWidth = 1 + r() * 3;
    const x = r() * W; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + r() * 20 - 10, H / 3, x + r() * 20 - 10, H * 2 / 3, x + r() * 10 - 5, H); g.stroke(); }
});

/* -------------------------------------------------------------- materials */
const M = {
  gold: new THREE.MeshStandardMaterial({ color: 0xcaa24f, metalness: 1, roughness: 0.32 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xa7874a, metalness: 1, roughness: 0.45 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 1, roughness: 0.12 }),
  acrylic: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.08 }),
  marbleWall: new THREE.MeshPhysicalMaterial({ map: marbleTex(21, 2048, 1024, 6), roughness: 0.18, clearcoat: 0.6 }),
  marbleBox: new THREE.MeshPhysicalMaterial({ map: marbleTex(33, 1024, 512, 3), roughness: 0.2, clearcoat: 0.5 }),
  marbleTop: new THREE.MeshPhysicalMaterial({ map: marbleTex(41, 512, 512), roughness: 0.2, clearcoat: 0.5 }),
  osb: new THREE.MeshStandardMaterial({ map: osbTex, roughness: 0.9, side: THREE.DoubleSide }),
  pine: new THREE.MeshStandardMaterial({ map: pineTex, roughness: 0.7 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.07, roughness: 0.04, side: THREE.DoubleSide, depthWrite: false }),
  frosted: new THREE.MeshPhysicalMaterial({ color: 0xe8f0f2, roughness: 0.6, transmission: 0, transparent: true, opacity: 0.88 }),
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.75 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf6f5f1, roughness: 0.85 }),
  linen: new THREE.MeshStandardMaterial({ color: 0xf1efe9, roughness: 0.95 }),
  terry: new THREE.MeshStandardMaterial({ color: 0xf8f7f3, roughness: 1 }),
  damask: new THREE.MeshStandardMaterial({ map: damaskTex, roughness: 0.55, metalness: 0.15 }),
  olive: new THREE.MeshStandardMaterial({ color: 0x4f5a2a, roughness: 0.9 }),
  sage: new THREE.MeshStandardMaterial({ color: 0x86a49c, roughness: 0.9 }),
  stone: new THREE.MeshStandardMaterial({ color: 0xe4ddd0, roughness: 0.85 }),
  terracotta: new THREE.MeshStandardMaterial({ color: 0xb98a64, roughness: 0.9 }),
  darkPot: new THREE.MeshStandardMaterial({ color: 0x2c2c28, roughness: 0.6, metalness: 0.3 }),
  leaf: new THREE.MeshStandardMaterial({ color: 0x3f7a2c, roughness: 0.6, side: THREE.DoubleSide }),
  leafDark: new THREE.MeshStandardMaterial({ color: 0x2c5a22, roughness: 0.6, side: THREE.DoubleSide }),
  fern: new THREE.MeshStandardMaterial({ color: 0x5f8f3d, roughness: 0.8, side: THREE.DoubleSide }),
  black: new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: 0.5 }),
  acUnit: new THREE.MeshStandardMaterial({ color: 0xf4f4f2, roughness: 0.35 }),
  canopy: new THREE.MeshStandardMaterial({ color: 0xe6cd8a, roughness: 0.35, metalness: 0.25, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false }),
  water: new THREE.MeshPhysicalMaterial({ color: 0x9fd8de, transparent: true, opacity: 0.45, roughness: 0.05, depthWrite: false }),
  flame: new THREE.MeshBasicMaterial({ color: 0xffc777 }),
  stoveGlass: new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0xff7a2a, emissiveIntensity: 0, roughness: 0.2 }),
  bulb: new THREE.MeshStandardMaterial({ color: 0xfff6e0, emissive: 0xffe2a8, emissiveIntensity: 0.2 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x6b5a45, roughness: 1 }),
  olea: new THREE.MeshStandardMaterial({ color: 0x6f7f4e, roughness: 1, flatShading: true }),
  ground: new THREE.MeshStandardMaterial({ color: 0x9a8f6a, roughness: 1 }),
};

/* ------------------------------------------------------------------ scene */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(72, 1, 0.05, 300);

function add(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
function box(w, h, d, mat, x, y, z, parent) { return add(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent); }
function cyl(rt, rb, h, mat, x, y, z, parent, seg = 24) { return add(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, parent); }
function lathe(profile, mat, parent, seg = 32) { return add(new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), seg), mat, 0, 0, 0, parent); }
function group(x = 0, y = 0, z = 0, ry = 0, parent = scene) { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; }

/* sky + lights */
const skyU = { top: { value: new THREE.Color(0x3d7fd6) }, mid: { value: new THREE.Color(0x9cc6ee) }, bot: { value: new THREE.Color(0xdde8ee) } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: skyU,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h=vP.y; vec3 c = h>0.15? mix(mid,top,smoothstep(0.15,0.8,h)) : mix(bot,mid,smoothstep(-0.05,0.15,h)); gl_FragColor=vec4(c,1.); }' }));
scene.add(sky);
const cloudTex = canvasTex(256, 128, (g, W, H) => { const r = rng(3); for (let i = 0; i < 26; i++) { const x = 40 + r() * 176, y = 50 + r() * 40, rad = 18 + r() * 30;
  const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); } });
const clouds = new THREE.Group(); scene.add(clouds);
{ const r = rng(9); for (let i = 0; i < 16; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, depthWrite: false, fog: false }));
  const a = r() * 6.28, d = 60 + r() * 40; s.position.set(Math.cos(a) * d, 22 + r() * 30, Math.sin(a) * d); s.scale.set(40 + r() * 30, 18 + r() * 10, 1); clouds.add(s); } }
const stars = (() => { const r = rng(42), n = 1800, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const u = r() * 6.28, v = Math.acos(r() * 0.95); p.set([Math.sin(v) * Math.cos(u) * 120, Math.cos(v) * 120, Math.sin(v) * Math.sin(u) * 120], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const s = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: true, transparent: true, opacity: 0.9, depthWrite: false })); s.visible = false; scene.add(s); return s; })();

const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x8a7a5a, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.position.set(6, 11, 7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
const nightLights = [];
function warmLight(color, intensity, dist, x, y, z) { const l = new THREE.PointLight(color, 0, dist, 2); l.position.set(x, y, z); l.userData.on = intensity; scene.add(l); nightLights.push(l); return l; }

/* ------------------------------------------------------- geodesic dome */
const R = 4.2;
const DOOR = V(2.35, 0, 3.4).setLength(3.9); // floor point of the entrance (south-east)
const doorAz = Math.atan2(DOOR.x, DOOR.z);
{
  const ico = new THREE.IcosahedronGeometry(1, 4);
  ico.rotateZ(-Math.atan2(1, (1 + Math.sqrt(5)) / 2)); // a vertex points straight up
  const pos = ico.attributes.position;
  const fix = (v) => { if (v.y < 0.02) { v.y = 0; v.setLength(1); } return v; };
  const tris = [];
  for (let i = 0; i < pos.count; i += 3) {
    const a = V().fromBufferAttribute(pos, i), b = V().fromBufferAttribute(pos, i + 1), c = V().fromBufferAttribute(pos, i + 2);
    const cy = (a.y + b.y + c.y) / 3; if (cy < -0.03 || Math.min(a.y, b.y, c.y) < -0.22) continue;
